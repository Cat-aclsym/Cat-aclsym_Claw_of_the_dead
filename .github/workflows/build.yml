name: Build Cat'aclysm Android APK

on:
  push:
    branches:
      - main
      - develop
      - feature/workflow

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.0
          use-dotnet: false

      - name: Setup Android export template
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.4.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_export_templates.tpz
          unzip -q Godot_v4.4-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.4.stable/

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ~/Cataclysm.keystore

      - name: Verify keystore
        run: |
          keytool -list -keystore ~/Cataclysm.keystore -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -v 2>&1 | head -20 || true

      - name: Configure keystore in export presets
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          cat > /tmp/patch_presets.py << 'PYEOF'
          import os
          import sys

          password = os.environ["KEYSTORE_PASSWORD"]
          with open("export_presets.cfg", "r") as f:
              content = f.read()

          injection = (
              'package/signed=true\n'
              'keystore/release="/home/runner/Cataclysm.keystore"\n'
              f'keystore/release_password="{password}"\n'
              'keystore/release_user="Cataclysm"\n'
              'keystore/debug="/home/runner/Cataclysm.keystore"\n'
              f'keystore/debug_password="{password}"\n'
              'keystore/debug_user="Cataclysm"'
          )

          if 'package/signed=true' not in content:
              print("ERROR: package/signed=true not found in export_presets.cfg")
              sys.exit(1)

          content = content.replace('package/signed=true', injection)

          with open("export_presets.cfg", "w") as f:
              f.write(content)

          print("Done!")
          PYEOF
          python3 /tmp/patch_presets.py
          grep -n "keystore" export_presets.cfg || true

      - name: Import project
        run: |
          godot --headless --import || true

      - name: Force Godot resource import
        run: |
          mkdir -p .godot/editor .godot/imported
          godot --headless --editor --quit || true

      - name: Build APK
        run: |
          mkdir -p exports
          godot --headless --export-release "Android" exports/Cataclysm.apk || true
          godot --headless --export-release "Android" exports/Cataclysm.apk

      - name: Install apktool
        run: |
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O /usr/local/bin/apktool.jar
          echo '#!/bin/bash' > /usr/local/bin/apktool
          echo 'java -jar /usr/local/bin/apktool.jar "$@"' >> /usr/local/bin/apktool
          chmod +x /usr/local/bin/apktool

      - name: Inject Firebase Game Loop intent filter
        run: |
          apktool d -f exports/Cataclysm.apk -o exports/apk_decoded
          python3 - <<'EOF'
          with open("exports/apk_decoded/AndroidManifest.xml", "r") as f:
              content = f.read()

          intent_filter = '''
              <intent-filter>
                  <action android:name="com.google.intent.action.TEST_LOOP"/>
                  <category android:name="android.intent.category.DEFAULT"/>
                  <data android:mimeType="application/javascript"/>
              </intent-filter>
              <meta-data android:name="com.google.test.loops" android:value="2"/>'''

          content = content.replace(
              '</activity>',
              intent_filter + '\n    </activity>',
              1
          )

          with open("exports/apk_decoded/AndroidManifest.xml", "w") as f:
              f.write(content)

          # Supprimer la référence themed_icon de public.xml
          with open("exports/apk_decoded/res/values/public.xml", "r") as f:
              pub = f.read()
          pub = "\n".join([l for l in pub.splitlines() if "themed_icon" not in l])
          with open("exports/apk_decoded/res/values/public.xml", "w") as f:
              f.write(pub)

          print("Done!")
          EOF
          rm -rf exports/apk_decoded/res/values-anydpi-v26/
          apktool b exports/apk_decoded -o exports/Cataclysm_unsigned.apk

      - name: Sign patched APK
        run: |
          /usr/local/lib/android/sdk/build-tools/34.0.0/apksigner sign \
            --ks ~/Cataclysm.keystore \
            --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} \
            --ks-key-alias Cataclysm \
            --out exports/Cataclysm.apk \
            exports/Cataclysm_unsigned.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cataclysm-apk
          path: exports/Cataclysm.apk

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Run Firebase Game Loop Test
        run: |
          gcloud firebase test android run \
            --type=game-loop \
            --app=exports/Cataclysm.apk \
            --scenario-numbers=1 \
            --device model=MediumPhone,version=35 \
            --project ${{ secrets.FIREBASE_PROJECT_ID }} \
            --timeout=3m