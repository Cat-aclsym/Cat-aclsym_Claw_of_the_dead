name: Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  check:
    name: Check scripts, smoke test and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2.4.3
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false

      - name: Restore import cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # uid_cache.bin is left out: a cache restored from a fallback key would map uids to renamed paths.
          path: .godot/imported
          key: godot-import-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ hashFiles('**/*.import', 'project.godot') }}
          restore-keys: |
            godot-import-${{ runner.os }}-${{ env.GODOT_VERSION }}-

      - name: Import project
        run: godot --headless --path . --import

      - name: Check scripts compile
        run: godot --headless --path . --quit-after 3000 res://tools/check_scripts.tscn

      - name: Smoke test
        run: godot --headless --path . --quit-after 6000 res://tools/smoke_test.tscn

      # Exit codes: 100 on a failing test, 101 on orphan nodes, 105 on a script error, see README.md
      - name: Unit tests
        run: godot --headless --path . -s res://addons/gdUnit4/bin/GdUnitCmdTool.gd -a res://tests -c --ignoreHeadlessMode -rd res://reports

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report
          path: reports/
          retention-days: 14
          if-no-files-found: ignore

  export:
    name: Export Windows and Android
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Godot with export templates
        uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2.4.3
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Restore import cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .godot/imported
          key: godot-import-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ hashFiles('**/*.import', 'project.godot') }}
          restore-keys: |
            godot-import-${{ runner.os }}-${{ env.GODOT_VERSION }}-

      - name: Import project
        run: godot --headless --path . --import

      - name: Export Windows
        run: |
          mkdir -p exports/windows
          godot --headless --path . --export-release "Windows Desktop" exports/windows/Cataclysm.exe

      - name: Decode Android keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::KEYSTORE_BASE64 is not set, the Android APK is exported with the debug keystore."
          else
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/Cataclysm.keystore"
            chmod 600 "$RUNNER_TEMP/Cataclysm.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Export Android (release, signed)
        if: steps.keystore.outputs.signed == 'true'
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/Cataclysm.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: Cataclysm
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          mkdir -p exports/android
          godot --headless --path . --export-release "Android" exports/android/Cataclysm.apk

      - name: Export Android (debug keystore, no secrets)
        if: steps.keystore.outputs.signed != 'true'
        run: |
          mkdir -p exports/android
          godot --headless --path . --export-debug "Android" exports/android/Cataclysm.apk

      - name: Verify Android signature and 16 KB alignment
        run: |
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          "$build_tools/apksigner" verify exports/android/Cataclysm.apk
          "$build_tools/zipalign" -c -P 16 4 exports/android/Cataclysm.apk

      - name: Upload Windows artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Cataclysm-windows
          path: exports/windows/Cataclysm.exe
          retention-days: 14
          if-no-files-found: error

      - name: Upload Android artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Cataclysm-android
          path: exports/android/Cataclysm.apk
          retention-days: 14
          if-no-files-found: error
